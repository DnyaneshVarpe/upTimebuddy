<!DOCTYPE html>
<html>
<head>
    <title>UptimeBuddy</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #4a4a8a; color: white; }
        .UP { color: green; font-weight: bold; }
        .DOWN { color: red; font-weight: bold; }
        .NOT.CHECKED { color: gray; }
        form { margin-bottom: 20px; }
        input[type=text] { padding: 8px; width: 300px; }
        button { padding: 8px 16px; cursor: pointer; }
        a { margin-right: 10px; text-decoration: none; color: #4a4a8a; }
    </style>
</head>
<body>
    <h1>UptimeBuddy</h1>

    <form action="/add" method="POST">
        <input type="text" name="url" placeholder="https://example.com" required>
        <button type="submit">Add URL</button>
    </form>

    <table>
        <tr>
            <th>URL</th>
            <th>Status</th>
            <th>Status Code</th>
            <th>Response Time (ms)</th>
            <th>Last Checked</th>
            <th>Actions</th>
        </tr>
        {% for r in results %}
        <tr>
            <td>{{ r.url }}</td>
            <td class="{{ r.status.replace(' ', '.') }}">{{ r.status }}</td>
            <td>{{ r.status_code }}</td>
            <td>{{ r.response_time }}</td>
            <td>{{ r.checked_at }}</td>
            <td>
                <a href="/check/{{ r.id }}">Check now</a>
                <a href="/delete/{{ r.id }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
